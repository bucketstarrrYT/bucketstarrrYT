name: Repository CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: detect
        shell: bash
        run: |
          for pair in "gradle:build.gradle" "gradlek:build.gradle.kts" "maven:pom.xml" "node:package.json" "python:pyproject.toml" "go:go.mod" "rust:Cargo.toml"; do
            key="${pair%%:*}"; file="${pair#*:}"
            [[ -f "$file" ]] && echo "$key=true" >> "$GITHUB_OUTPUT" || echo "$key=false" >> "$GITHUB_OUTPUT"
          done
      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.gradle == 'true' || steps.detect.outputs.gradlek == 'true'
      - name: Build Gradle
        if: steps.detect.outputs.gradle == 'true' || steps.detect.outputs.gradlek == 'true'
        run: |
          if [[ -f gradlew ]]; then chmod +x gradlew; ./gradlew --no-daemon build; else gradle --no-daemon build; fi
      - name: Verify Maven
        if: steps.detect.outputs.maven == 'true'
        run: |
          if [[ -f mvnw ]]; then chmod +x mvnw; ./mvnw -B -ntp verify; else mvn -B -ntp verify; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: "22"
      - name: Test Node
        if: steps.detect.outputs.node == 'true'
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then npm ci; else npm install; fi
          npm test --if-present
          npm run build --if-present
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.python == 'true'
        with:
          python-version: "3.12"
      - name: Check Python
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          [[ ! -f requirements.txt ]] || pip install -r requirements.txt
          [[ ! -f pyproject.toml ]] || pip install -e .
          python -m compileall -q .
      - name: Test Go
        if: steps.detect.outputs.go == 'true'
        run: go test ./...
      - name: Test Rust
        if: steps.detect.outputs.rust == 'true'
        run: cargo test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            **/build/libs/*.jar
            **/target/*.jar
            **/dist/*
          if-no-files-found: ignore
          retention-days: 14
